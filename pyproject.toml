[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aarepeats"
version = "1.0.0"
description = "Detection and analysis of amino acid repeats in protein sequences"
readme = "README.md"
authors = [{ name = "Ali Ahmadi Esfidi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "biopython>=1.80"]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat", "nbconvert", "ipykernel"]

[project.scripts]
aarepeats = "aarepeats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
